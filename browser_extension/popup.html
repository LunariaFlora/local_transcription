<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>导入工作台</title>
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        color: #f8fafc;
        background: #0b0b0c;
        font: 13px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 10px 12px;
        color: #06101f;
        background: linear-gradient(135deg, #3b82f6, #93c5fd);
        font-weight: 700;
        cursor: pointer;
      }
      p {
        margin: 10px 0 0;
        color: #a1a1aa;
      }
      #status {
        min-height: 20px;
        margin-top: 10px;
        color: #bfdbfe;
      }
    </style>
  </head>
  <body>
    <button id="importCurrent">导入当前页面</button>
    <p>在 YouTube 页面也会自动出现“导入工作台”浮动按钮。</p>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
